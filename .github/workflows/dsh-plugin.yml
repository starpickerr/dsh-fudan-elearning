name: DSH plugin

on:
  push:
    branches: [main, develop]
    tags: ['plugin-v*']
  pull_request:
  workflow_dispatch:

jobs:
  pack:
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: mac-arm64
          - runner: windows-latest
            platform: win-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dsh-fudan-elearning
    steps:
      - uses: actions/checkout@v7
        with:
          path: dsh-fudan-elearning
      - uses: actions/checkout@v7
        with:
          repository: starpickerr/Alcor
          ref: 8b7468adcb9f2aa30dd720f4f67be2d7af564351
          path: Alcor
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dsh-fudan-elearning/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: dsh-fudan-elearning/plugin/package-lock.json
      - run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == Windows ]]; then
            python_exe=.venv/Scripts/python.exe
          else
            python_exe=.venv/bin/python
          fi
          "$python_exe" -m pip install --require-hashes -r requirements.lock
          "$python_exe" -m pip install PyInstaller==6.22.3
          npm ci --prefix plugin --ignore-scripts
        shell: bash
      - name: Package the native plugin
        working-directory: dsh-fudan-elearning/plugin
        run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-plugin-${{ matrix.platform }}
          path: dsh-fudan-elearning/plugin/*.tgz
          if-no-files-found: error
