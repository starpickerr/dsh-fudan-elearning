[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stella-elearning-mcp"
version = "1.0.6"
description = "Independent local elearning MCP server"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "playwright>=1.40,<2"]

[project.scripts]
elearning-mcp = "elearning_mcp.server:cli"

[tool.setuptools.packages.find]
include = ["elearning_mcp*"]

[tool.setuptools.package-data]
elearning_mcp = ["*.json", "*.sql"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
